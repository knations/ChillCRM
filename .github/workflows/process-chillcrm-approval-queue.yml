name: Process CHILLCRM Approval Queue

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the Google Sheet without posting to CHILLCRM or deleting rows"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "0 17 * * *"

jobs:
  process-approval-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHILLCRM_AUTOMATION_TOKEN: ${{ secrets.CHILLCRM_AUTOMATION_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_APPROVAL_SHEET_ID: "1IDZbgwlAMts05cgKwmcF5ACPDeJKcArC7mu8v38UnTQ"
      GOOGLE_APPROVAL_SHEET_NAME: "Awaiting Approval"
      CHILLCRM_BASE_URL: "https://chillcrm.app"
      IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Process approved rows
        run: |
          mkdir -p reports
          DRY_RUN_FLAG=""
          if [ "$IS_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/process_sheet_approval_rows_once.py \
            --google-sheet-id "$GOOGLE_APPROVAL_SHEET_ID" \
            --sheet-name "$GOOGLE_APPROVAL_SHEET_NAME" \
            --report reports/github_approval_processor_result.json \
            --base-url "$CHILLCRM_BASE_URL" \
            --delete-processed-rows \
            $DRY_RUN_FLAG

      - name: Upload no-secret run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chillcrm-approval-processor-report
          path: reports/github_approval_processor_result.json
          if-no-files-found: ignore
