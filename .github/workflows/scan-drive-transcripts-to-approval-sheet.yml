name: Scan Drive Transcripts To Approval Sheet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan rows without appending to the approval sheet"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      drive_folder_id:
        description: "Google Drive Otter Transcripts folder ID"
        required: false
        default: "1TQR1D0dxTEitoUNDHVoR8bg3bRrdhiaZ"
      max_files:
        description: "Maximum newly changed transcript files to process"
        required: true
        default: "10"
  schedule:
    - cron: "30 17 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GOOGLE_APPROVAL_SHEET_ID: "1IDZbgwlAMts05cgKwmcF5ACPDeJKcArC7mu8v38UnTQ"
      GOOGLE_APPROVAL_SHEET_NAME: "Awaiting Approval"
      DEFAULT_TRANSCRIPT_FOLDER_ID: "1TQR1D0dxTEitoUNDHVoR8bg3bRrdhiaZ"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan transcripts
        shell: bash
        run: |
          mkdir -p reports
          DRIVE_FOLDER_ID="${{ inputs.drive_folder_id }}"
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            DRIVE_FOLDER_ID="$DEFAULT_TRANSCRIPT_FOLDER_ID"
          fi
          MAX_FILES="${{ inputs.max_files }}"
          if [ -z "$MAX_FILES" ]; then
            MAX_FILES="10"
          fi
          DRY_RUN="${{ inputs.dry_run }}"
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/scan_drive_transcripts_to_approval_sheet.py \
            --drive-folder-id "$DRIVE_FOLDER_ID" \
            --google-sheet-id "$GOOGLE_APPROVAL_SHEET_ID" \
            --approval-sheet-name "$GOOGLE_APPROVAL_SHEET_NAME" \
            --max-files "$MAX_FILES" \
            --report reports/transcript_intake_result.json \
            $DRY_FLAG

      - name: Upload transcript intake report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-intake-report
          path: reports/transcript_intake_result.json
