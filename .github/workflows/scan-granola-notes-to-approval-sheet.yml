name: Scan Granola Notes To Approval Sheet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan rows without appending to the approval sheet"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_notes:
        description: "Maximum newly changed Granola notes to process"
        required: true
        default: "10"
      lookback_days:
        description: "How far back to list Granola notes when checking for unprocessed items"
        required: true
        default: "30"
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GOOGLE_APPROVAL_SHEET_ID: "1IDZbgwlAMts05cgKwmcF5ACPDeJKcArC7mu8v38UnTQ"
      GOOGLE_APPROVAL_SHEET_NAME: "Awaiting Approval"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan Granola notes
        shell: bash
        run: |
          mkdir -p reports
          MAX_NOTES="${{ inputs.max_notes }}"
          if [ -z "$MAX_NOTES" ]; then
            MAX_NOTES="10"
          fi
          LOOKBACK_DAYS="${{ inputs.lookback_days }}"
          if [ -z "$LOOKBACK_DAYS" ]; then
            LOOKBACK_DAYS="30"
          fi
          DRY_RUN="${{ inputs.dry_run }}"
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/scan_granola_notes_to_approval_sheet.py \
            --google-sheet-id "$GOOGLE_APPROVAL_SHEET_ID" \
            --approval-sheet-name "$GOOGLE_APPROVAL_SHEET_NAME" \
            --max-notes "$MAX_NOTES" \
            --lookback-days "$LOOKBACK_DAYS" \
            --report reports/granola_intake_result.json \
            $DRY_FLAG

      - name: Upload Granola intake report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granola-intake-report
          path: reports/granola_intake_result.json
